<svg class="fly-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fruit fly">
  <style>
.fly-svg { overflow: visible; }
.fly-svg .fly-hover { animation: fly-hover 3.2s ease-in-out infinite; }
.fly-svg .fly-wing { transform-box: view-box; }
.fly-svg .fly-wing--l { transform-origin: 86px 106px; animation: fly-flutter-l 4.6s ease-in-out infinite; }
.fly-svg .fly-wing--r { transform-origin: 114px 106px; animation: fly-flutter-r 4.6s ease-in-out infinite; }
.fly-svg .fly-eye { transform-box: fill-box; transform-origin: 50% 50%; animation: fly-blink 5.3s infinite; }
.fly-svg .fly-eye--r { animation-delay: .04s; }
.fly-svg .fly-glint { animation: fly-look 7s ease-in-out infinite; }
.fly-svg .fly-antenna { transform-box: view-box; animation: fly-twitch 2.8s ease-in-out infinite; }
.fly-svg .fly-antenna--l { transform-origin: 92px 50px; }
.fly-svg .fly-antenna--r { transform-origin: 108px 50px; animation-delay: .35s; }
.fly-svg .fly-glow { opacity: 0; transition: opacity .4s; }
.is-thinking .fly-svg .fly-wing--l { animation: fly-buzz-l .07s linear infinite alternate; }
.is-thinking .fly-svg .fly-wing--r { animation: fly-buzz-r .07s linear infinite alternate; }
.is-thinking .fly-svg .fly-wing-blade { opacity: .55; }
.is-thinking .fly-svg .fly-antenna { animation-duration: .5s; }
.is-thinking .fly-svg .fly-hover { animation-duration: 1.1s; }
.is-thinking .fly-svg .fly-glow { opacity: 1; animation: fly-pulse 1s ease-in-out infinite; }
@keyframes fly-hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes fly-flutter-l {
  0%, 70%, 100% { transform: rotate(0deg); }
  73% { transform: rotate(26deg); } 76% { transform: rotate(-4deg); } 79% { transform: rotate(22deg); }
  82% { transform: rotate(-3deg); } 85% { transform: rotate(12deg); } 88% { transform: rotate(0deg); }
}
@keyframes fly-flutter-r {
  0%, 70%, 100% { transform: rotate(0deg); }
  73% { transform: rotate(-26deg); } 76% { transform: rotate(4deg); } 79% { transform: rotate(-22deg); }
  82% { transform: rotate(3deg); } 85% { transform: rotate(-12deg); } 88% { transform: rotate(0deg); }
}
@keyframes fly-buzz-l { from { transform: rotate(-6deg); } to { transform: rotate(34deg); } }
@keyframes fly-buzz-r { from { transform: rotate(6deg); } to { transform: rotate(-34deg); } }
@keyframes fly-blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.12); } }
@keyframes fly-look {
  0%, 20%, 100% { transform: translate(0, 0); } 28%, 45% { transform: translate(3px, 1px); }
  55%, 72% { transform: translate(-3px, 1.5px); } 80% { transform: translate(0, -1px); }
}
@keyframes fly-twitch { 0%, 60%, 100% { transform: rotate(0deg); } 68% { transform: rotate(-9deg); } 76% { transform: rotate(5deg); } 84% { transform: rotate(-3deg); } }
@keyframes fly-pulse { 50% { opacity: .45; } }
.fly-still:not(.is-thinking) .fly-svg * { animation: none !important; }
@media (prefers-reduced-motion: reduce) {
  .fly-svg *, .is-thinking .fly-svg * { animation: none !important; }
}
</style>
  <defs>
    <linearGradient id="fly-wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf8ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b9dde8" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="fly-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".2" stop-color="#ffb3f0" stop-opacity="0"/>
      <stop offset=".45" stop-color="#ffc8f4" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#9ff0ff" stop-opacity=".6"/>
      <stop offset=".8" stop-color="#9ff0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fly-eye" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff8f7a"/>
      <stop offset=".45" stop-color="#e0352b"/>
      <stop offset="1" stop-color="#8c1712"/>
    </radialGradient>
    <pattern id="fly-facets" width="5" height="4.4" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.2" r="1.3" fill="#5e0d09"/>
    </pattern>
    <radialGradient id="fly-head" cx=".5" cy=".35" r=".7">
      <stop offset="0" stop-color="#f3c97a"/>
      <stop offset="1" stop-color="#b98232"/>
    </radialGradient>
    <radialGradient id="fly-thorax" cx=".45" cy=".3" r=".75">
      <stop offset="0" stop-color="#d9a24e"/>
      <stop offset="1" stop-color="#8a5a22"/>
    </radialGradient>
    <linearGradient id="fly-abdomen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98232"/>
      <stop offset=".45" stop-color="#f0c46e"/>
      <stop offset="1" stop-color="#a06d28"/>
    </linearGradient>
    <clipPath id="fly-abclip"><ellipse cx="100" cy="150" rx="25" ry="32"/></clipPath>
    <radialGradient id="fly-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c7a4ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#c7a4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="fly-hover">
    <ellipse class="fly-glow" cx="100" cy="66" rx="66" ry="46" fill="url(#fly-glow)"/>
    <path d="M86 112 C72 112 62 104 52 108 L44 116" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M86 120 C70 124 60 126 52 136 L48 146" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 128 C78 138 72 148 70 160 L68 170" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 112 C128 112 138 104 148 108 L156 116" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 120 C130 124 140 126 148 136 L152 146" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 128 C122 138 128 148 130 160 L132 170" fill="none" stroke="#4a3320" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="fly-wing fly-wing--l">
      <path class="fly-wing-blade" d="M86 104 C70 104 40 118 28 142 C18 162 24 180 40 180 C58 180 74 158 82 136 C86 124 88 112 88 106 Z" fill="url(#fly-wing)" stroke="#9fc9d6" stroke-opacity=".7" stroke-width="1.2"/>
      <path d="M86 106 C68 116 46 136 34 162 M86 108 C74 124 60 146 50 174 M87 110 C82 128 74 150 64 170" fill="none" stroke="#7fb0bf" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
      <path d="M86 104 C70 104 40 118 28 142 C18 162 24 180 40 180 C58 180 74 158 82 136 C86 124 88 112 88 106 Z" fill="url(#fly-sheen)" opacity=".55"/>
    </g><g class="fly-wing fly-wing--r">
      <path class="fly-wing-blade" d="M114 104 C130 104 160 118 172 142 C182 162 176 180 160 180 C142 180 126 158 118 136 C114 124 112 112 112 106 Z" fill="url(#fly-wing)" stroke="#9fc9d6" stroke-opacity=".7" stroke-width="1.2"/>
      <path d="M114 106 C132 116 154 136 166 162 M114 108 C126 124 140 146 150 174 M113 110 C118 128 126 150 136 170" fill="none" stroke="#7fb0bf" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"/>
      <path d="M114 104 C130 104 160 118 172 142 C182 162 176 180 160 180 C142 180 126 158 118 136 C114 124 112 112 112 106 Z" fill="url(#fly-sheen)" opacity=".55"/>
    </g>
    <ellipse cx="100" cy="150" rx="25" ry="32" fill="url(#fly-abdomen)"/>
    <g clip-path="url(#fly-abclip)" fill="#5a3818" opacity=".75">
      <rect x="70" y="140" width="60" height="6" rx="3"/>
      <rect x="70" y="154" width="60" height="6.5" rx="3"/>
      <rect x="70" y="168" width="60" height="7" rx="3"/>
    </g>
    <ellipse cx="94" cy="138" rx="6" ry="10" fill="#fff" opacity=".18"/>
    <ellipse cx="100" cy="112" rx="28" ry="22" fill="url(#fly-thorax)"/>
    <path d="M86 104 C92 98 108 98 114 104" fill="none" stroke="#6b4318" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <g fill="#4a2e12" opacity=".7">
      <circle cx="90" cy="112" r="1.4"/><circle cx="100" cy="116" r="1.4"/><circle cx="110" cy="112" r="1.4"/>
      <circle cx="95" cy="122" r="1.2"/><circle cx="105" cy="122" r="1.2"/>
    </g>
    <path class="fly-antenna fly-antenna--l" d="M92 50 C88 40 82 34 74 32" fill="none" stroke="#5a3818" stroke-width="3" stroke-linecap="round"/>
    <path class="fly-antenna fly-antenna--r" d="M108 50 C112 40 118 34 126 32" fill="none" stroke="#5a3818" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="100" cy="74" rx="30" ry="25" fill="url(#fly-head)"/>
    <g fill="#7a4e1c" opacity=".8"><circle cx="100" cy="54" r="2"/><circle cx="95" cy="58" r="1.6"/><circle cx="105" cy="58" r="1.6"/></g>
    
    <g class="fly-eye fly-eye--l">
      <ellipse cx="76" cy="66" rx="23" ry="25" fill="url(#fly-eye)"/>
      <ellipse cx="76" cy="66" rx="23" ry="25" fill="url(#fly-facets)" opacity=".5"/>
      <ellipse cx="76" cy="66" rx="23" ry="25" fill="none" stroke="#6e1410" stroke-opacity=".5" stroke-width="1.5"/>
      <g class="fly-glint">
        <ellipse cx="68" cy="55" rx="7" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 68 55)"/>
        <circle cx="83" cy="74" r="2.6" fill="#fff" opacity=".55"/>
      </g>
    </g>
    <g class="fly-eye fly-eye--r">
      <ellipse cx="124" cy="66" rx="23" ry="25" fill="url(#fly-eye)"/>
      <ellipse cx="124" cy="66" rx="23" ry="25" fill="url(#fly-facets)" opacity=".5"/>
      <ellipse cx="124" cy="66" rx="23" ry="25" fill="none" stroke="#6e1410" stroke-opacity=".5" stroke-width="1.5"/>
      <g class="fly-glint">
        <ellipse cx="116" cy="55" rx="7" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 116 55)"/>
        <circle cx="131" cy="74" r="2.6" fill="#fff" opacity=".55"/>
      </g>
    </g>
    <path d="M94 90 Q100 96 106 90" fill="none" stroke="#6b4318" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M100 94 L100 101" stroke="#6b4318" stroke-width="3" stroke-linecap="round"/>
    
  </g>
</svg>
